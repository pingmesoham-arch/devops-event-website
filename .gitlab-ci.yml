variables:
  GET_SOURCES_ATTEMPTS: 5
  GIT_DEPTH: 1

stages:
  - test
  - deploy

run_selenium_junit_tests:
  stage: test
  image: markhobson/maven-chrome:jdk-17
  script:
    - mvn test

deploy_to_aws:
  stage: deploy
  image:
    name: amazon/aws-cli:latest
    entrypoint: [""]
  script:
    - aws --version
    - aws s3 sync . s3://$S3_BUCKET_NAME --exclude '*' --include 'index.html' --include 'script.js' --include 'style.css'
  only:
    - main